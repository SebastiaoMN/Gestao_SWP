services:
  api:
    build: .
    environment:
      SCC_DATABASE_URL: postgresql+psycopg://contracts:contracts@postgres:5432/contracts
      SCC_AUTH_ENABLED: "true"
      SCC_KEYCLOAK_ISSUER: http://keycloak:8080/realms/software-contracts
      SCC_KEYCLOAK_CLIENT_ID: software-contract-control
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - keycloak

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contracts
      POSTGRES_USER: contracts
      POSTGRES_PASSWORD: contracts
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

volumes:
  postgres-data:
