<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Ciclo de Contratações</title>
  <style>
    body{margin:0;background:#f4f6f8;color:#1f2933;font-family:Arial,Helvetica,sans-serif}.top{background:#7e1819;color:white;font-size:14px}.wrap{max-width:1280px;margin:auto;padding:0 16px}.top .wrap{display:flex;justify-content:flex-end;gap:18px;padding-top:8px;padding-bottom:8px}header{background:white;border-bottom:1px solid #d7dde3}.brand{display:flex;gap:16px;align-items:center;padding:20px 16px}.mark{background:#003f6b;color:white;border-bottom:5px solid #c9972b;font-weight:800;padding:18px}.brand small{color:#5f6f7d}.brand h1{color:#002b49;margin:.2rem 0 0;font-size:25px}nav{background:#003f6b}nav button{background:transparent;color:white;border:0;padding:14px 13px;font-weight:700;cursor:pointer}nav button.active{background:#c9972b;color:#002b49}main{padding:24px 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #d7dde3;box-shadow:0 .35rem .9rem #1f29330f;padding:18px}.card{border-left:5px solid #c9972b}.metric{font-size:34px;color:#002b49;font-weight:800}.muted{color:#5f6f7d}.panel{margin-top:18px;overflow:hidden}.table-wrap{overflow-x:auto;margin-top:16px}table{min-width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #d7dde3;padding:9px;text-align:left;vertical-align:top;white-space:nowrap}th{background:#eef2f6;color:#002b49}tbody tr{cursor:pointer}tbody tr:hover{background:#fff7df}input,select,textarea{border:1px solid #b8c2cc;padding:9px;width:100%;box-sizing:border-box;font:inherit}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;align-items:end}.item-form{grid-template-columns:minmax(430px,2fr) minmax(260px,1.3fr) repeat(3,minmax(170px,1fr));max-width:100%}.item-form .wide{grid-column:span 2}.item-form #it_ciclo{min-width:430px}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary{border:0;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#003f6b;color:white;border-bottom:4px solid #c9972b}.secondary{background:#eef2f6;color:#002b49;border-bottom:4px solid #b8c2cc}a{color:#003f6b;font-weight:800}.alert{color:#7e1819;font-weight:800}.edit-note{background:#fff7df;border-left:5px solid #c9972b;margin-bottom:12px;padding:10px}.truncate{max-width:300px;white-space:normal}@media(max-width:900px){.item-form{grid-template-columns:1fr}.item-form .wide{grid-column:auto}.item-form #it_ciclo{min-width:0}}
  </style>
</head>
<body>
  <div class="top"><div class="wrap"><span>Acessibilidade</span><span>Alto contraste</span></div></div>
  <header><div class="wrap brand"><div class="mark">SWP</div><div><small>Tribunal de Justiça do Estado de Minas Gerais</small><h1>Controle de Ciclo de Contratações de Software de Prateleira</h1></div></div><nav><div class="wrap"><button class="active" data-view="dashboard">Painel</button><button data-view="itens">Itens</button><button data-view="ciclos">Ciclos</button><button data-view="softwares">Softwares</button><button data-view="areas">Áreas</button><button data-view="processos">Processos</button><button data-view="contratos">Contratos</button><button data-view="relatorios">Relatórios</button><a style="color:white;padding-left:16px" href="/docs">Swagger</a></div></nav></header>
  <main class="wrap" id="app">Carregando...</main>
<script>
const API='/api/v1'; let state={}; let view='dashboard'; let editing={};
async function get(p){const r=await fetch(API+p); if(!r.ok) throw new Error(await r.text()); return r.json()}
async function send(method,p,b){const r=await fetch(API+p,{method,headers:{'Content-Type':'application/json','X-User-Profile':'administrador'},body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json()}
async function post(p,b){return send('POST',p,b)} async function put(p,b){return send('PUT',p,b)}
async function load(){state.dashboard=await get('/dashboard');state.softwares=await get('/softwares');state.areas=await get('/areas');state.ciclos=await get('/ciclos');state.processos=await get('/processos');state.contratos=await get('/contratos');state.itens=await get('/itens');render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()})
function v(id){return document.getElementById(id)?.value || ''} function set(id,val){const el=document.getElementById(id); if(el) el.value = val ?? ''}
function boolVal(x){return x==='true' || x===true} function numVal(x){return x===''?null:Number(x)}
function render(){if(view==='dashboard') return dashboard(); if(view==='softwares') return softwareView(); if(view==='areas') return areaView(); if(view==='ciclos') return cicloView(); if(view==='processos') return processoView(); if(view==='contratos') return contracts(); if(view==='itens') return items(); if(view==='relatorios') return reports();}
function dashboard(){app.innerHTML=`<section class="grid"><div class="card"><span class="muted">Itens</span><div class="metric">${state.dashboard.total_itens}</div></div><div class="card"><span class="muted">Softwares distintos</span><div class="metric">${state.dashboard.total_softwares_distintos}</div></div><div class="card"><span class="muted">Vencidos</span><div class="metric alert">${state.dashboard.vencidos}</div></div><div class="card"><span class="muted">Sem processo SEI</span><div class="metric">${state.dashboard.itens_sem_processo_sei}</div></div></section>${breakdown('Por status',state.dashboard.por_status)}${breakdown('Vencimentos',state.dashboard.vencimentos)}`}
function breakdown(t,d){return `<section class="panel"><h2>${t}</h2><div class="grid">${Object.entries(d).map(([k,v])=>`<div class="card"><span>${k}</span><div class="metric">${v}</div></div>`).join('')}</div></section>`}
function note(type){return editing[type]?`<div class="edit-note">Editando registro #${editing[type].id}. Clique em salvar para atualizar ou em limpar para novo cadastro.</div>`:''}
function actions(type, saveFn){return `<div class="actions"><button class="primary" onclick="${saveFn}()">${editing[type]?'Salvar alterações':'Salvar'}</button><button class="secondary" onclick="editing['${type}']=null;render()">Limpar</button></div>`}
function table(headers, rows, mapper, dbl){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr ondblclick="${dbl}(${r.id})">${mapper(r)}</tr>`).join('')}</tbody></table></div>`}
function opt(rows,label='nome',selected){return `<option value="">Selecione</option>`+rows.map(r=>`<option value="${r.id}" ${selected==r.id?'selected':''}>${r[label]}</option>`).join('')}
function softwareView(){const e=editing.softwares||{};app.innerHTML=`<section class="panel"><h2>Softwares</h2>${note('softwares')}<div class="form"><input id="sw_nome" placeholder="nome" value="${e.nome||''}"><input id="sw_fabricante" placeholder="fabricante" value="${e.fabricante||''}"><input id="sw_categoria" placeholder="categoria" value="${e.categoria||''}"><input id="sw_tipo_licenca" placeholder="tipo_licenca" value="${e.tipo_licenca||''}"><input id="sw_modelo_fornecimento" placeholder="modelo_fornecimento" value="${e.modelo_fornecimento||''}"><select id="sw_rep"><option value="false">Sem representante no Brasil</option><option value="true" ${e.possui_representante_brasil?'selected':''}>Possui representante no Brasil</option></select><select id="sw_livre"><option value="false">Software proprietário</option><option value="true" ${e.software_livre?'selected':''}>Software livre</option></select><select id="sw_ativo"><option value="true">Ativo</option><option value="false" ${e.ativo===false?'selected':''}>Inativo</option></select><input id="sw_obs" placeholder="observacoes" value="${e.observacoes||''}">${actions('softwares','saveSoftware')}</div>${table(['id','nome','fabricante','categoria','tipo licença','modelo','representante BR','software livre','ativo','observações'],state.softwares,r=>`<td>${r.id}</td><td>${r.nome||''}</td><td>${r.fabricante||''}</td><td>${r.categoria||''}</td><td>${r.tipo_licenca||''}</td><td>${r.modelo_fornecimento||''}</td><td>${r.possui_representante_brasil?'sim':'não'}</td><td>${r.software_livre?'sim':'não'}</td><td>${r.ativo?'sim':'não'}</td><td class="truncate">${r.observacoes||''}</td>`,'editSoftware')}</section>`}
function editSoftware(id){editing.softwares=state.softwares.find(x=>x.id===id);softwareView()} async function saveSoftware(){const body={nome:v('sw_nome'),fabricante:v('sw_fabricante')||null,categoria:v('sw_categoria')||null,tipo_licenca:v('sw_tipo_licenca')||null,modelo_fornecimento:v('sw_modelo_fornecimento')||null,possui_representante_brasil:boolVal(v('sw_rep')),software_livre:boolVal(v('sw_livre')),ativo:boolVal(v('sw_ativo')),observacoes:v('sw_obs')||null}; editing.softwares?await put('/softwares/'+editing.softwares.id,body):await post('/softwares',body); editing.softwares=null; await load()}
function areaView(){const e=editing.areas||{};app.innerHTML=`<section class="panel"><h2>Áreas</h2>${note('areas')}<div class="form"><input id="ar_sigla" placeholder="sigla" value="${e.sigla||''}"><input id="ar_nome" placeholder="nome" value="${e.nome||''}"><input id="ar_unidade" placeholder="unidade_superior" value="${e.unidade_superior||''}"><input id="ar_resp" placeholder="responsavel" value="${e.responsavel||''}"><input id="ar_email" placeholder="email" value="${e.email||''}"><input id="ar_tel" placeholder="telefone" value="${e.telefone||''}"><select id="ar_ativo"><option value="true">Ativo</option><option value="false" ${e.ativo===false?'selected':''}>Inativo</option></select>${actions('areas','saveArea')}</div>${table(['id','sigla','nome','unidade superior','responsável','email','telefone','ativo'],state.areas,r=>`<td>${r.id}</td><td>${r.sigla||''}</td><td>${r.nome||''}</td><td>${r.unidade_superior||''}</td><td>${r.responsavel||''}</td><td>${r.email||''}</td><td>${r.telefone||''}</td><td>${r.ativo?'sim':'não'}</td>`,'editArea')}</section>`}
function editArea(id){editing.areas=state.areas.find(x=>x.id===id);areaView()} async function saveArea(){const body={sigla:v('ar_sigla'),nome:v('ar_nome'),unidade_superior:v('ar_unidade')||null,responsavel:v('ar_resp')||null,email:v('ar_email')||null,telefone:v('ar_tel')||null,ativo:boolVal(v('ar_ativo'))}; editing.areas?await put('/areas/'+editing.areas.id,body):await post('/areas',body); editing.areas=null; await load()}
function cicloView(){const e=editing.ciclos||{};app.innerHTML=`<section class="panel"><h2>Ciclos</h2>${note('ciclos')}<div class="form"><input id="ci_nome" placeholder="nome" value="${e.nome||''}"><input id="ci_ano" placeholder="ano" type="number" value="${e.ano||''}"><select id="ci_sem"><option value="1" ${e.semestre==='1'?'selected':''}>1º semestre</option><option value="2" ${e.semestre==='2'?'selected':''}>2º semestre</option></select><input id="ci_ini" type="date" value="${e.data_inicio||''}"><input id="ci_fim" type="date" value="${e.data_fim||''}"><input id="ci_status" placeholder="status" value="${e.status||'planejado'}"><input id="ci_desc" placeholder="descricao" value="${e.descricao||''}">${actions('ciclos','saveCiclo')}</div>${table(['id','nome','ano','semestre','data início','data fim','status','descrição'],state.ciclos,r=>`<td>${r.id}</td><td>${r.nome||''}</td><td>${r.ano||''}</td><td>${r.semestre||''}</td><td>${r.data_inicio||''}</td><td>${r.data_fim||''}</td><td>${r.status||''}</td><td class="truncate">${r.descricao||''}</td>`,'editCiclo')}</section>`}
function editCiclo(id){editing.ciclos=state.ciclos.find(x=>x.id===id);cicloView()} async function saveCiclo(){const body={nome:v('ci_nome'),ano:+v('ci_ano'),semestre:v('ci_sem'),data_inicio:v('ci_ini'),data_fim:v('ci_fim'),status:v('ci_status'),descricao:v('ci_desc')||null}; editing.ciclos?await put('/ciclos/'+editing.ciclos.id,body):await post('/ciclos',body); editing.ciclos=null; await load()}
function processoView(){const e=editing.processos||{};app.innerHTML=`<section class="panel"><h2>Processos</h2>${note('processos')}<div class="form"><input id="pr_num" placeholder="numero" value="${e.numero||''}"><select id="pr_tipo"><option value="sei" ${e.tipo==='sei'?'selected':''}>SEI</option><option value="dod" ${e.tipo==='dod'?'selected':''}>DOD</option><option value="outro" ${e.tipo==='outro'?'selected':''}>Outro</option></select><input id="pr_link" placeholder="link" value="${e.link||''}"><input id="pr_status" placeholder="status" value="${e.status||'aberto'}"><input id="pr_obs" placeholder="observacoes" value="${e.observacoes||''}">${actions('processos','saveProcesso')}</div>${table(['id','número','tipo','link','status','observações'],state.processos,r=>`<td>${r.id}</td><td>${r.numero||''}</td><td>${r.tipo||''}</td><td>${r.link||''}</td><td>${r.status||''}</td><td class="truncate">${r.observacoes||''}</td>`,'editProcesso')}</section>`}
function editProcesso(id){editing.processos=state.processos.find(x=>x.id===id);processoView()} async function saveProcesso(){const body={numero:v('pr_num'),tipo:v('pr_tipo'),link:v('pr_link')||null,status:v('pr_status'),observacoes:v('pr_obs')||null}; editing.processos?await put('/processos/'+editing.processos.id,body):await post('/processos',body); editing.processos=null; await load()}
function contracts(){const e=editing.contratos||{};app.innerHTML=`<section class="panel"><h2>Contratos</h2>${note('contratos')}<div class="form"><select id="ct_sw">${opt(state.softwares,'nome',e.software_id)}</select><input id="ct_num" placeholder="numero" value="${e.numero||''}"><input id="ct_forn" placeholder="fornecedor" value="${e.fornecedor||''}"><input id="ct_ini" type="date" value="${e.data_inicio||''}"><input id="ct_fim" type="date" value="${e.data_fim||''}"><input id="ct_venc" type="date" value="${e.vencimento_subscricao||''}"><input id="ct_qtd" placeholder="quantidade_contratada" type="number" value="${e.quantidade_contratada||''}"><input id="ct_estimado" placeholder="valor_estimado" type="number" value="${e.valor_estimado||''}"><input id="ct_valor" placeholder="valor_contratado" type="number" value="${e.valor_contratado||''}"><input id="ct_status" placeholder="status" value="${e.status||'vigente'}"><input id="ct_obs" placeholder="observacoes" value="${e.observacoes||''}">${actions('contratos','saveContract')}</div>${table(['id','número','software','fornecedor','início','fim','vencimento','qtd contratada','valor estimado','valor contratado','status','observações'],state.contratos,r=>`<td>${r.id}</td><td>${r.numero||''}</td><td>${r.software?.nome||''}</td><td>${r.fornecedor||''}</td><td>${r.data_inicio||''}</td><td>${r.data_fim||''}</td><td>${r.vencimento_subscricao||''}</td><td>${r.quantidade_contratada||''}</td><td>${r.valor_estimado||''}</td><td>${r.valor_contratado||''}</td><td>${r.status||''}</td><td class="truncate">${r.observacoes||''}</td>`,'editContract')}</section>`}
function editContract(id){editing.contratos=state.contratos.find(x=>x.id===id);contracts()} async function saveContract(){const body={software_id:+v('ct_sw'),numero:v('ct_num'),fornecedor:v('ct_forn'),data_inicio:v('ct_ini'),data_fim:v('ct_fim'),vencimento_subscricao:v('ct_venc')||null,quantidade_contratada:numVal(v('ct_qtd')),valor_estimado:numVal(v('ct_estimado')),valor_contratado:numVal(v('ct_valor')),status:v('ct_status'),observacoes:v('ct_obs')||null}; editing.contratos?await put('/contratos/'+editing.contratos.id,body):await post('/contratos',body); editing.contratos=null; await load()}
function items(){const e=editing.itens||{};const areaId=e.areas?.[0]?.id;const procId=e.processos?.[0]?.id;app.innerHTML=`<section class="panel"><h2>Itens do ciclo</h2>${note('itens')}<div class="form item-form"><select id="it_ciclo" title="Ciclo">${opt(state.ciclos,'nome',e.ciclo_id)}</select><select id="it_sw" title="Software">${opt(state.softwares,'nome',e.software_id)}</select><select id="it_area" title="Área">${opt(state.areas,'sigla',areaId)}</select><select id="it_proc" title="Processo"><option value="">Sem processo</option>${state.processos.map(r=>`<option value="${r.id}" ${procId==r.id?'selected':''}>${r.numero}</option>`).join('')}</select><select id="it_contrato" title="Contrato"><option value="">Sem contrato</option>${state.contratos.map(r=>`<option value="${r.id}" ${e.contrato_id==r.id?'selected':''}>${r.numero}</option>`).join('')}</select><input id="it_tipo" placeholder="tipo_movimentacao" value="${e.tipo_movimentacao||'novo_pedido'}"><input id="it_mod" placeholder="modalidade" value="${e.modalidade||'a_definir'}"><input id="it_lote" placeholder="lote" value="${e.lote||''}"><input id="it_venc" type="date" value="${e.vencimento_subscricao||''}"><input id="it_qtd_atual" type="number" placeholder="quantidade_atual" value="${e.quantidade_atual||''}"><input id="it_qtd" type="number" placeholder="quantidade_solicitada" value="${e.quantidade_solicitada||''}"><input id="it_qtd_add" type="number" placeholder="quantidade_adicional" value="${e.quantidade_adicional||''}"><input id="it_un" placeholder="unidade_medida" value="${e.unidade_medida||'licenca'}"><input id="it_prior" placeholder="prioridade" value="${e.prioridade||'media'}"><input id="it_status" placeholder="status" value="${e.status||'cadastrado'}"><input id="it_just" class="wide" placeholder="justificativa" value="${e.justificativa||''}"><input id="it_obs" class="wide" placeholder="observacoes" value="${e.observacoes||''}"><input id="it_risco" class="wide" placeholder="risco" value="${e.risco||''}">${actions('itens','saveItem')}</div>${table(['id','ciclo','software','tipo','modalidade','lote','contrato','vencimento','qtd atual','qtd solicitada','qtd adicional','unidade','prioridade','status','áreas','processos','justificativa','observações','risco'],state.itens,r=>`<td>${r.id}</td><td class="truncate">${r.ciclo?.nome||''}</td><td>${r.software?.nome||''}</td><td>${r.tipo_movimentacao||''}</td><td>${r.modalidade||''}</td><td>${r.lote||''}</td><td>${r.contrato?.numero||''}</td><td>${r.vencimento_subscricao||''}</td><td>${r.quantidade_atual||''}</td><td>${r.quantidade_solicitada||''}</td><td>${r.quantidade_adicional||''}</td><td>${r.unidade_medida||''}</td><td>${r.prioridade||''}</td><td>${r.status||''}</td><td>${(r.areas||[]).map(a=>a.sigla).join(', ')}</td><td>${(r.processos||[]).map(p=>p.numero).join(', ')}</td><td class="truncate">${r.justificativa||''}</td><td class="truncate">${r.observacoes||''}</td><td class="truncate">${r.risco||''}</td>`,'editItem')}</section>`}
function editItem(id){editing.itens=state.itens.find(x=>x.id===id);items()} async function saveItem(){const body={ciclo_id:+v('it_ciclo'),software_id:+v('it_sw'),tipo_movimentacao:v('it_tipo'),modalidade:v('it_mod'),lote:v('it_lote')||null,contrato_id:v('it_contrato')?+v('it_contrato'):null,vencimento_subscricao:v('it_venc')||null,quantidade_atual:numVal(v('it_qtd_atual')),quantidade_solicitada:numVal(v('it_qtd')),quantidade_adicional:numVal(v('it_qtd_add')),unidade_medida:v('it_un'),prioridade:v('it_prior'),status:v('it_status'),justificativa:v('it_just')||null,observacoes:v('it_obs')||null,risco:v('it_risco')||null,area_ids:[+v('it_area')],processo_ids:v('it_proc')?[+v('it_proc')]:[]}; editing.itens?await put('/itens/'+editing.itens.id,body):await post('/itens',body); editing.itens=null; await load()}
function reports(){app.innerHTML=`<section class="panel"><h2>Relatórios</h2>${['itens','consolidado-softwares','por-area','vencimentos'].map(r=>`<p>${r}: <a href="/api/v1/export/${r}?formato=csv">CSV</a> | <a href="/api/v1/export/${r}?formato=xlsx">XLSX</a></p>`).join('')}</section>`}
load().catch(e=>app.innerHTML='<p class="alert">Erro: '+e.message+'</p>')
</script>
</body>
</html>
